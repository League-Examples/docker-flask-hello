[project]
name = "docker-flask-hello"
version = "0.1.0"
description = "A simple Flask app that displays a random hello-world ASCII art page on each load"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1",
    "gunicorn>=23.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-flask>=1.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
