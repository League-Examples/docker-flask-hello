<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello, World!</title>
    <style>
      body {
        background: #1a1a2e;
        color: #e0e0e0;
        font-family: monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }
      pre {
        line-height: 1.3;
        font-size: clamp(0.55rem, 1.5vw, 1rem);
        color: #00ff99;
        text-shadow: 0 0 8px #00ff99;
      }
      p.tagline {
        color: #aaa;
        font-size: 0.9rem;
        margin-top: 1.5rem;
      }
    </style>
  </head>
  <body>
    {% block content %}{% endblock %}
    <p class="tagline">Reload for a new greeting &#x21bb;</p>
  </body>
</html>
