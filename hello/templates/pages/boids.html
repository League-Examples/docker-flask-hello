{% extends "base.html" %}
{% block content %}
<style>
  body { margin: 0; padding: 0; overflow: hidden; display: block; }
  .tagline { display: none; }
  canvas { display: block; transition: opacity 300ms; }

  .control-panel {
    position: fixed;
    top: 20px;
    right: 20px;
    background: #0d0d1a;
    border: 1px solid #00ff99;
    color: #00ff99;
    font-family: monospace;
    padding: 16px;
    border-radius: 6px;
    z-index: 100;
    min-width: 220px;
  }
  .control-panel h3 { margin: 0 0 8px; font-size: 1rem; }
  .control-panel label { display: block; margin: 8px 0 2px; font-size: 0.85rem; }
  .control-panel input[type=range] { width: 100%; accent-color: #00ff99; }
  .control-panel input[type=checkbox] { accent-color: #00ff99; }
  .control-panel button#panel-close {
    position: absolute; top: 6px; right: 8px;
    background: transparent; border: none; color: #00ff99;
    font-family: monospace; font-size: 1rem; cursor: pointer;
  }
</style>
<canvas id="c" data-page="boids"></canvas>
<div id="panel" class="control-panel" hidden>
  <button id="panel-close" type="button" aria-label="Close">&#x2715;</button>
  <h3>Controls</h3>
  <label>Boid Count: <span id="lbl-count">120</span></label>
  <input id="ctl-count" type="range" min="20" max="300" value="120" step="1">
  <label>Max Speed: <span id="lbl-speed">3.5</span></label>
  <input id="ctl-speed" type="range" min="1" max="8" value="3.5" step="0.1">
  <label>Perception Radius: <span id="lbl-perception">80</span></label>
  <input id="ctl-perception" type="range" min="20" max="200" value="80" step="1">
  <label>Separation: <span id="lbl-separation">1.8</span></label>
  <input id="ctl-separation" type="range" min="0" max="5" value="1.8" step="0.1">
  <label><input id="ctl-trails" type="checkbox"> Trails</label>
</div>
<script>
  // ── Config ────────────────────────────────────────────────────────────────
  const CFG = {
    count:            120,
    maxSpeed:         3.5,
    perceptionRadius: 80,
    separationRadius: 30,
    separationWeight: 1.8,
    alignmentWeight:  1.0,
    cohesionWeight:   1.0,
    mouseWeight:      0.8,
    maxForce:         0.08,  // per-frame steering acceleration cap (px/frame²)
    size:             10,
    trails:           false,
  };

  // ── Easter egg trigger registry ───────────────────────────────────────────
  const TRIGGERS = {
    transform_chaos:    { type: 'key',      key: 'c' },
    transform_scatter:  { type: 'sequence', keys: ['ArrowUp','ArrowUp','ArrowDown','ArrowDown'] },
    transition_voronoi: { type: 'key',      key: 'v' },
    panel:              { type: 'still',    durationMs: 3000 },
  };

  // ── Canvas setup ──────────────────────────────────────────────────────────
  const canvas = document.getElementById('c');
  const ctx    = canvas ? canvas.getContext('2d') : null;

  let W = window.innerWidth;
  let H = window.innerHeight;

  if (!canvas || !ctx) {
    document.body.innerHTML =
      '<p style="color:#00ff99;font-family:monospace;padding:2rem">Canvas not supported.</p>';
  } else {
    canvas.width  = W;
    canvas.height = H;
  }

  // ── Simulation state ──────────────────────────────────────────────────────
  let boids = [];
  let currentFillColor = '#00ff99';
  let mouseX = -9999, mouseY = -9999, mouseInCanvas = false;

  // ── Easter egg state ──────────────────────────────────────────────────────
  let activeTransform = null;
  let savedCFG = null;
  let savedFillColor = null;
  let keyBuffer = [];
  let keyBufferTimer = null;
  let mouseStillTimer = null;

  // ── Pure transform definitions (exposed for tests) ────────────────────────
  function applyTransform(id, cfg, state) {
    switch (id) {
      case 'transform_chaos':
        cfg.maxSpeed *= 3;
        cfg.separationWeight = 0.1;
        state.fillColor = '#ff4444';
        break;
      case 'transform_scatter':
        cfg.separationWeight = 5.0;
        cfg.cohesionWeight   = 0.0;
        state.fillColor = '#44aaff';
        break;
    }
  }

  // ── Core simulation functions ─────────────────────────────────────────────
  function initBoids() {
    boids = [];
    for (let i = 0; i < CFG.count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * CFG.maxSpeed;
      boids.push({
        x:  Math.random() * W,
        y:  Math.random() * H,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
      });
    }
  }

  function steerSeparation(boid, neighbors) {
    let sx = 0, sy = 0;
    for (const n of neighbors) {
      const dx = boid.x - n.x;
      const dy = boid.y - n.y;
      const d  = Math.sqrt(dx * dx + dy * dy);
      if (d > 0 && d < CFG.separationRadius) {
        sx += dx / d;
        sy += dy / d;
      }
    }
    return { x: sx, y: sy };
  }

  function steerAlignment(boid, neighbors) {
    if (neighbors.length === 0) return { x: 0, y: 0 };
    let avgVx = 0, avgVy = 0;
    for (const n of neighbors) { avgVx += n.vx; avgVy += n.vy; }
    avgVx /= neighbors.length; avgVy /= neighbors.length;
    const mag = Math.sqrt(avgVx * avgVx + avgVy * avgVy);
    if (mag === 0) return { x: 0, y: 0 };
    const desiredVx = (avgVx / mag) * CFG.maxSpeed;
    const desiredVy = (avgVy / mag) * CFG.maxSpeed;
    return { x: desiredVx - boid.vx, y: desiredVy - boid.vy };
  }

  function steerCohesion(boid, neighbors) {
    if (neighbors.length === 0) return { x: 0, y: 0 };
    let avgX = 0, avgY = 0;
    for (const n of neighbors) { avgX += n.x; avgY += n.y; }
    avgX /= neighbors.length; avgY /= neighbors.length;
    const dx  = avgX - boid.x;
    const dy  = avgY - boid.y;
    const mag = Math.sqrt(dx * dx + dy * dy);
    if (mag === 0) return { x: 0, y: 0 };
    const desiredVx = (dx / mag) * CFG.maxSpeed;
    const desiredVy = (dy / mag) * CFG.maxSpeed;
    return { x: desiredVx - boid.vx, y: desiredVy - boid.vy };
  }

  function wrapEdges(boid) {
    boid.x = ((boid.x % W) + W) % W;
    boid.y = ((boid.y % H) + H) % H;
  }

  // ── Rendering ─────────────────────────────────────────────────────────────
  function drawBoid(ctx, boid, color) {
    const angle = Math.atan2(boid.vy, boid.vx);
    ctx.save();
    ctx.translate(boid.x, boid.y);
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(CFG.size * 1.5, 0);
    ctx.lineTo(-CFG.size * 0.75,  CFG.size * 0.6);
    ctx.lineTo(-CFG.size * 0.75, -CFG.size * 0.6);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.restore();
  }

  // Faint clue: a "ghost boid" hue and a "?" glyph in the corner.
  // Both rendered at globalAlpha ≤ 0.25 per Requirement 5.1/5.5.
  function drawClues(ctx, W, H) {
    ctx.save();
    ctx.shadowBlur = 0;

    // Clue 1: faint "?" glyph, bottom-right corner
    ctx.globalAlpha = 0.18;
    ctx.font = '14px monospace';
    ctx.fillStyle = '#00ff99';
    ctx.fillText('?', W - 24, H - 16);

    // Clue 2: a single boid-shaped marker in a different hue, drifting along
    // a slow Lissajous so it reads as "alive but anomalous"
    ctx.globalAlpha = 0.15;
    const t = (typeof performance !== 'undefined' ? performance.now() : Date.now()) / 1000;
    const ghost = {
      x:  W / 2 + Math.cos(t * 0.3) * (W * 0.3),
      y:  H / 2 + Math.sin(t * 0.5) * (H * 0.3),
      vx: Math.cos(t * 0.3),
      vy: Math.sin(t * 0.5),
    };
    drawBoid(ctx, ghost, '#ff99ff');

    ctx.restore();
  }

  function drawBoids() {
    if (CFG.trails) {
      // Partial fade for trail effect
      ctx.fillStyle = 'rgba(26, 26, 46, 0.15)';
      ctx.fillRect(0, 0, W, H);
    } else {
      ctx.clearRect(0, 0, W, H);
    }

    ctx.shadowBlur  = 12;
    ctx.shadowColor = currentFillColor;

    for (const boid of boids) {
      drawBoid(ctx, boid, currentFillColor);
    }

    ctx.shadowBlur = 0;
    drawClues(ctx, W, H);
  }

  // ── Physics ───────────────────────────────────────────────────────────────
  // Cap a steering vector's magnitude to maxForce. Without this, steerings
  // that compute (desiredV - currentV) overshoot and produce visible jitter.
  function limitForce(fx, fy, maxForce) {
    const mag = Math.sqrt(fx * fx + fy * fy);
    if (mag > maxForce) {
      return { x: (fx / mag) * maxForce, y: (fy / mag) * maxForce };
    }
    return { x: fx, y: fy };
  }

  function updateBoids(dt) {
    const scale = dt / 16.67;
    const maxForce = CFG.maxForce;

    for (const boid of boids) {
      const neighbors = [];
      for (const other of boids) {
        if (other === boid) continue;
        const dx = other.x - boid.x;
        const dy = other.y - boid.y;
        const d  = Math.sqrt(dx * dx + dy * dy);
        if (d < CFG.perceptionRadius) neighbors.push(other);
      }

      let sep = steerSeparation(boid, neighbors);
      let ali = steerAlignment(boid, neighbors);
      let coh = steerCohesion(boid, neighbors);
      sep = limitForce(sep.x, sep.y, maxForce);
      ali = limitForce(ali.x, ali.y, maxForce);
      coh = limitForce(coh.x, coh.y, maxForce);

      let mfx = 0, mfy = 0;
      if (mouseInCanvas) {
        const dx  = mouseX - boid.x;
        const dy  = mouseY - boid.y;
        const mag = Math.sqrt(dx * dx + dy * dy);
        if (mag > 0) {
          const desiredVx = (dx / mag) * CFG.maxSpeed;
          const desiredVy = (dy / mag) * CFG.maxSpeed;
          const m = limitForce(desiredVx - boid.vx, desiredVy - boid.vy, maxForce);
          mfx = m.x; mfy = m.y;
        }
      }

      boid.vx += (sep.x * CFG.separationWeight + ali.x * CFG.alignmentWeight
               +  coh.x * CFG.cohesionWeight   + mfx   * CFG.mouseWeight) * scale;
      boid.vy += (sep.y * CFG.separationWeight + ali.y * CFG.alignmentWeight
               +  coh.y * CFG.cohesionWeight   + mfy   * CFG.mouseWeight) * scale;

      const speed = Math.sqrt(boid.vx * boid.vx + boid.vy * boid.vy);
      if (speed > CFG.maxSpeed) {
        boid.vx = (boid.vx / speed) * CFG.maxSpeed;
        boid.vy = (boid.vy / speed) * CFG.maxSpeed;
      }

      boid.x += boid.vx * scale;
      boid.y += boid.vy * scale;
      wrapEdges(boid);
    }
  }

  // ── Easter egg handlers ───────────────────────────────────────────────────
  function handleTransform(id) {
    if (activeTransform === id) {
      Object.assign(CFG, savedCFG);
      currentFillColor = savedFillColor;
      savedCFG = null; savedFillColor = null;
      activeTransform = null;
    } else {
      if (savedCFG !== null) {
        Object.assign(CFG, savedCFG);
        currentFillColor = savedFillColor;
      }
      savedCFG = Object.assign({}, CFG);
      savedFillColor = currentFillColor;
      const state = { fillColor: currentFillColor };
      applyTransform(id, CFG, state);
      currentFillColor = state.fillColor;
      activeTransform = id;
    }
  }

  function handleTransition(url) {
    canvas.style.opacity = '0';
    setTimeout(() => { window.location.href = url; }, 300);
  }

  function handlePanelToggle() {
    const panel = document.getElementById('panel');
    if (!panel) return;
    if (panel.hidden) panel.hidden = false;
    else panel.hidden = true;
  }

  function dispatchTrigger(id) {
    if (id === 'panel') return handlePanelToggle();
    if (id === 'transition_voronoi') return handleTransition('/voronoi');
    if (id.startsWith('transform_')) return handleTransform(id);
  }

  // ── Input: key sequence buffer + single-key dispatch ──────────────────────
  function onKeyDown(e) {
    keyBuffer.push(e.key);
    if (keyBuffer.length > 20) keyBuffer.shift();
    clearTimeout(keyBufferTimer);
    keyBufferTimer = setTimeout(() => { keyBuffer = []; }, 3000);

    // Sequence triggers first (longest match wins implicitly via tail compare)
    for (const [id, trig] of Object.entries(TRIGGERS)) {
      if (trig.type !== 'sequence') continue;
      const seq = trig.keys;
      if (keyBuffer.length >= seq.length) {
        const tail = keyBuffer.slice(-seq.length);
        if (tail.every((k, i) => k === seq[i])) {
          keyBuffer = [];
          clearTimeout(keyBufferTimer);
          dispatchTrigger(id);
          return;
        }
      }
    }
    // Single-key triggers
    for (const [id, trig] of Object.entries(TRIGGERS)) {
      if (trig.type === 'key' && e.key === trig.key) {
        dispatchTrigger(id);
        return;
      }
    }
  }

  // ── Mouse tracking + mouse-still detection ────────────────────────────────
  function onMouseMove(e) {
    const rect = canvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
    mouseY = e.clientY - rect.top;
    mouseInCanvas = true;

    clearTimeout(mouseStillTimer);
    mouseStillTimer = setTimeout(() => {
      dispatchTrigger('panel');
    }, TRIGGERS.panel.durationMs);
  }

  // ── Resize ────────────────────────────────────────────────────────────────
  function resize() {
    const oldW = W, oldH = H;
    for (const b of boids) { b.x /= oldW; b.y /= oldH; }
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = W;
    canvas.height = H;
    for (const b of boids) { b.x *= W; b.y *= H; }
  }

  // ── Control panel wiring ──────────────────────────────────────────────────
  function wireControlPanel() {
    const panel = document.getElementById('panel');
    const closeBtn = document.getElementById('panel-close');
    const ctlCount = document.getElementById('ctl-count');
    const ctlSpeed = document.getElementById('ctl-speed');
    const ctlPerception = document.getElementById('ctl-perception');
    const ctlSeparation = document.getElementById('ctl-separation');
    const ctlTrails = document.getElementById('ctl-trails');
    const lblCount = document.getElementById('lbl-count');
    const lblSpeed = document.getElementById('lbl-speed');
    const lblPerception = document.getElementById('lbl-perception');
    const lblSeparation = document.getElementById('lbl-separation');

    if (!panel || !closeBtn) return;
    closeBtn.addEventListener('click', () => { panel.hidden = true; });

    ctlCount.addEventListener('input', (e) => {
      CFG.count = parseInt(e.target.value, 10);
      lblCount.textContent = CFG.count;
      initBoids();
    });
    ctlSpeed.addEventListener('input', (e) => {
      CFG.maxSpeed = parseFloat(e.target.value);
      lblSpeed.textContent = CFG.maxSpeed.toFixed(1);
    });
    ctlPerception.addEventListener('input', (e) => {
      CFG.perceptionRadius = parseInt(e.target.value, 10);
      lblPerception.textContent = CFG.perceptionRadius;
    });
    ctlSeparation.addEventListener('input', (e) => {
      CFG.separationWeight = parseFloat(e.target.value);
      lblSeparation.textContent = CFG.separationWeight.toFixed(1);
    });
    ctlTrails.addEventListener('input', (e) => {
      CFG.trails = e.target.checked;
    });
  }

  // ── Animation loop ────────────────────────────────────────────────────────
  let lastTimestamp = null;
  function loop(timestamp) {
    if (lastTimestamp === null) lastTimestamp = timestamp;
    const dt = Math.min(timestamp - lastTimestamp, 100);
    lastTimestamp = timestamp;
    updateBoids(dt);
    drawBoids();
    requestAnimationFrame(loop);
  }

  // ── Bootstrap ─────────────────────────────────────────────────────────────
  function attachEventListeners() {
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(resize, 100);
    });
    canvas.addEventListener('mousemove', onMouseMove);
    canvas.addEventListener('mouseleave', () => {
      mouseInCanvas = false;
      clearTimeout(mouseStillTimer);
    });
    document.addEventListener('keydown', onKeyDown);
  }

  function init() {
    initBoids();
    attachEventListeners();
    wireControlPanel();
    requestAnimationFrame(loop);
  }

  document.addEventListener('DOMContentLoaded', init);
</script>
{% endblock %}
